name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build hactool 1.4.0 for Android (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/aarch64-linux-android26-clang"
          git clone https://github.com/SciresM/hactool.git /tmp/hactool
          cd /tmp/hactool
          git checkout 1.4.0 2>/dev/null || true
          cp config.mk.template config.mk
          make -j"$(nproc)" CC="$CC" \
            CFLAGS="-O2 -fPIE -D_FILE_OFFSET_BITS=64 -Wno-everything -I." \
            LDFLAGS="-pie -Wl,-z,max-page-size=16384"
          "$BIN/llvm-strip" hactool
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp hactool "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libhactool.so"
          file hactool

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SwitchUnpacker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
